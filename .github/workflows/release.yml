name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.4)'
        required: true
        default: 'test-build'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "APP_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            # Extract version from tag (e.g., refs/tags/v0.4 -> 0.4)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish
        run: dotnet build -t:all -p:Version=${{ env.APP_VERSION }}

      - name: Move latest tag
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin -f latest

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ env.APP_VERSION }}"
          tag_name: v${{ env.APP_VERSION }}
          files: publish/llogin-*
          make_latest: true
